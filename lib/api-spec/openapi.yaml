openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ravyu Business Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: user
  - name: reviews
  - name: ai
  - name: business
  - name: requests
  - name: analytics
  - name: reports
  - name: settings
  - name: public

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and revoke refresh token
      responses:
        "204":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid or expired refresh token

  /auth/firebase:
    post:
      operationId: firebaseAuth
      tags: [auth]
      summary: Sign in or register via Firebase Google token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirebaseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirebaseAuthResult"
        "401":
          description: Invalid Firebase token

  # ── User ──────────────────────────────────────────────────────────────────
  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get current user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updateUserProfile
      tags: [user]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/onboarding:
    put:
      operationId: completeOnboarding
      tags: [user]
      summary: Save onboarding wizard data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/change-password:
    put:
      operationId: changePassword
      tags: [user]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Wrong current password

  /user/delete:
    delete:
      operationId: deleteAccount
      tags: [user]
      summary: Delete user account and all data
      responses:
        "204":
          description: Account deleted

  # ── Reviews ───────────────────────────────────────────────────────────────
  /reviews:
    get:
      operationId: getReviews
      tags: [reviews]
      summary: List stored reviews
      parameters:
        - in: query
          name: rating
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResult"

  /reviews/scrape:
    post:
      operationId: scrapeReviews
      tags: [reviews]
      summary: Scrape reviews from Google Maps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeInput"
      responses:
        "200":
          description: Scrape complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "400":
          description: Invalid URL

  /reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a stored review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── AI ────────────────────────────────────────────────────────────────────
  /ai/generate-reply:
    post:
      operationId: generateReply
      tags: [ai]
      summary: AI-generate a reply to a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReplyInput"
      responses:
        "200":
          description: Generated reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateReplyResult"

  /ai/generate-post:
    post:
      operationId: generatePost
      tags: [ai]
      summary: AI-generate social post from a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePostInput"
      responses:
        "200":
          description: Generated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePostResult"

  /ai/generate-content:
    post:
      operationId: generateContent
      tags: [ai]
      summary: AI-generate custom content from a prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateContentInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateContentResult"

  # ── Business Profile ──────────────────────────────────────────────────────
  /business/profile:
    get:
      operationId: getBusinessProfile
      tags: [business]
      summary: Get business profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
        "404":
          description: No profile yet
    post:
      operationId: createBusinessProfile
      tags: [business]
      summary: Create business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"
    put:
      operationId: updateBusinessProfile
      tags: [business]
      summary: Update business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProfile"

  # ── Business Services ─────────────────────────────────────────────────────
  /business/services:
    get:
      operationId: getBusinessServices
      tags: [business]
      summary: List services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessService"
    post:
      operationId: createBusinessService
      tags: [business]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessService"

  /business/services/{id}:
    put:
      operationId: updateBusinessService
      tags: [business]
      summary: Update a service
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessServiceInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessService"
    delete:
      operationId: deleteBusinessService
      tags: [business]
      summary: Delete a service
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /business/dashboard:
    get:
      operationId: getDashboardStats
      tags: [business]
      summary: Dashboard KPIs and summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Review Requests ───────────────────────────────────────────────────────
  /business/requests:
    get:
      operationId: getReviewRequests
      tags: [requests]
      summary: List review requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, sent, opened, completed]
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewRequest"
    post:
      operationId: createReviewRequest
      tags: [requests]
      summary: Create a review request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequest"

  /business/requests/bulk:
    post:
      operationId: bulkImportRequests
      tags: [requests]
      summary: Bulk import review requests via CSV data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /business/requests/{id}:
    put:
      operationId: updateReviewRequest
      tags: [requests]
      summary: Update a review request status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequest"
    delete:
      operationId: deleteReviewRequest
      tags: [requests]
      summary: Delete a review request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /business/requests/{id}/send-email:
    post:
      operationId: sendReviewRequestEmail
      tags: [requests]
      summary: Send review request email to customer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"

  # ── Analytics ─────────────────────────────────────────────────────────────
  /business/analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Get landing page analytics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  # ── Reports ───────────────────────────────────────────────────────────────
  /business/reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Get review stats report from stored reviews
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsData"

  /business/industry-profile:
    get:
      operationId: getIndustryProfile
      tags: [business]
      summary: Get industry profile configuration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryProfile"
    put:
      operationId: updateIndustryProfile
      tags: [business]
      summary: Update industry profile configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryProfile"

  /business/reports/industry:
    get:
      operationId: getIndustryReports
      tags: [reports]
      summary: Get industry specific intelligence report
      parameters:
        - in: query
          name: window
          schema:
            type: integer
            enum: [7, 30, 90]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryReportsData"

  /business/reports/weekly/generate:
    post:
      operationId: generateWeeklyIndustryReport
      tags: [reports]
      summary: Generate weekly owner report snapshot
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"

  /business/reports/weekly:
    get:
      operationId: listWeeklyIndustryReports
      tags: [reports]
      summary: List saved weekly owner reports for the business
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReportsListResponse"

  /business/reports/export:
    get:
      operationId: exportReportsCsv
      tags: [reports]
      summary: Export review report as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  # ── Settings ──────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  # ── Public endpoints ──────────────────────────────────────────────────────
  /public/business/{slug}:
    get:
      operationId: getPublicBusiness
      tags: [public]
      summary: Public business landing page data
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBusinessData"
        "404":
          description: Not found

  /public/business/{slug}/track-view:
    post:
      operationId: trackPageView
      tags: [public]
      summary: Track a page view on the public landing
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Tracked

  /public/business/{slug}/track-review-click:
    post:
      operationId: trackReviewClick
      tags: [public]
      summary: Track a review CTA click on the public landing
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Tracked

  /public/review/{slug}:
    get:
      operationId: getReviewCollectionPage
      tags: [public]
      summary: Review collection page data (Google review URL)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCollectionData"
        "404":
          description: Not found

  /public/review/{slug}/{token}:
    get:
      operationId: getTrackedReviewLink
      tags: [public]
      summary: Open tracked review link; mark request opened
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCollectionData"
        "404":
          description: Not found

  /public/pricing:
    get:
      operationId: getPricingPlans
      tags: [public]
      summary: Get industry pricing plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPlansData"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ─────────────────────────────────────────────────────────────────
    SignupInput:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        username:
          type: string
          minLength: 2

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    FirebaseInput:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    FirebaseAuthResult:
      type: object
      required: [accessToken, refreshToken, user, isNewUser]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
        isNewUser:
          type: boolean

    # ── User ─────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, username, profileComplete]
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        googleMapsUrl:
          type: ["string", "null"]
        businessType:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        challenges:
          type: ["array", "null"]
          items:
            type: string
        profileComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        username:
          type: string
        phone:
          type: string
        company:
          type: string

    OnboardingInput:
      type: object
      required: [phone, company, businessType, industry, challenges]
      properties:
        phone:
          type: string
        company:
          type: string
        businessType:
          type: string
          enum: [single, multiple, franchise, agency]
        industry:
          type: string
          enum: [restaurant, healthcare, hospitality, travel, retail, real_estate, professional, education, other]
        challenges:
          type: array
          items:
            type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    # ── Reviews ───────────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, author, rating, text, date, createdAt]
      properties:
        id:
          type: integer
        author:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
        date:
          type: string
        sourceUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ReviewListResult:
      type: object
      required: [reviews, total]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer

    ScrapeInput:
      type: object
      required: [mapsUrl]
      properties:
        mapsUrl:
          type: string
        maxReviews:
          type: integer
          default: 100
          maximum: 500

    ScrapeResult:
      type: object
      required: [imported, total]
      properties:
        imported:
          type: integer
        total:
          type: integer
        message:
          type: string

    # ── AI ────────────────────────────────────────────────────────────────────
    GenerateReplyInput:
      type: object
      required: [reviewText, rating]
      properties:
        reviewText:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        author:
          type: string
        businessName:
          type: string
        tone:
          type: string
          enum: [professional, casual, enthusiastic, formal, humorous]
          default: professional

    GenerateReplyResult:
      type: object
      required: [reply, sentiment]
      properties:
        reply:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]

    GeneratePostInput:
      type: object
      required: [reviewText, platform]
      properties:
        reviewText:
          type: string
        platform:
          type: string
          enum: [instagram, facebook, twitter, linkedin, google_business]
        tone:
          type: string
          enum: [professional, casual, enthusiastic, formal, humorous]
          default: professional
        primaryColor:
          type: string
        secondaryColor:
          type: string

    GeneratePostResult:
      type: object
      required: [caption]
      properties:
        caption:
          type: string
        imageUrl:
          type: ["string", "null"]

    GenerateContentInput:
      type: object
      required: [prompt, platform, contentType]
      properties:
        prompt:
          type: string
        platform:
          type: string
          enum: [instagram, facebook, twitter, linkedin, google_business]
        contentType:
          type: string
          enum: [text, image]
        tone:
          type: string
          enum: [professional, casual, enthusiastic, formal, humorous]
          default: professional

    GenerateContentResult:
      type: object
      required: [content]
      properties:
        content:
          type: string
        imageUrl:
          type: ["string", "null"]

    # ── Business ──────────────────────────────────────────────────────────────
    BusinessProfile:
      type: object
      required: [id, businessName, slug]
      properties:
        id:
          type: integer
        businessName:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
