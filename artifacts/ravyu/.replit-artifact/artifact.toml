kind = "web"
previewPath = "/"
title = "Ravyu — Business Hub"
version = "1.0.0"
id = "artifacts/ravyu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20620

[services.development]
run = "pnpm --filter @workspace/ravyu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ravyu", "run", "build" ]
publicDir = "artifacts/ravyu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20620"
BASE_PATH = "/"
